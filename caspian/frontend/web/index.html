<!DOCTYPE html>
<html lang="en">
  <head>
  <script>
    // Fix for form submission causing page reload
    window.addEventListener("DOMContentLoaded", function() {
      document.addEventListener("submit", function(e) {
        // Only prevent default for forms within our React app
        if (e.target.closest("#root")) {
          e.preventDefault();
        }
      });
    });
  </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caspian AI Assistant</title>
    <!-- Single preventative script for form submission -->
    <script>
      (function() {
        // Global variable to track if we've already handled form submission
        window.__preventDefaultHandled = false;
        
        // Function to setup form submission prevention
        function setupFormPrevention() {
          if (window.__preventDefaultHandled) return;
          
          // Prevent all form submissions
          document.addEventListener('submit', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }, true);
          
          // Also prevent 'Enter' key in inputs outside of textarea
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && 
                e.target.tagName !== 'TEXTAREA' && 
                !e.target.closest('form')) {
              e.preventDefault();
            }
          }, true);
          
          window.__preventDefaultHandled = true;
        }
        
        // Run immediately
        if (document.readyState === 'complete' || 
            document.readyState === 'interactive') {
          setupFormPrevention();
        } else {
          window.addEventListener('DOMContentLoaded', setupFormPrevention);
        }
        
        // Also run when the page is about to unload (last chance to prevent navigation)
        window.addEventListener('beforeunload', function(e) {
          // This message won't actually display in most browsers unless
          // the user has interacted with the page
          e.returnValue = 'Are you sure you want to leave?';
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
