version: '3.8'
services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://caspian_user:password@db:5432/caspian_db
      - DISCORD_TOKEN=your_discord_token_here
      - OPENAI_API_KEY=your_openai_api_key_here
      - SECRET_KEY=change-me
    depends_on:
      - db
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: caspian_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: caspian_db
    ports:
      - "5432:5432"
    volumes:
      - caspian_db_data:/var/lib/postgresql/data
volumes:
  caspian_db_data:
