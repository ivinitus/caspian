version: '3.8'
services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://caspian_user:password@db:5433/caspian_db
      - DISCORD_TOKEN=REMOVED
      - GEMINI_API_KEY=AREMOVED
      - SECRET_KEY=Vinitus@123
    depends_on:
      - db
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: caspian_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: caspian_db
    ports:
      - "5433:5432"
    volumes:
      - caspian_db_data:/var/lib/postgresql/data
volumes:
  caspian_db_data: