version: '3.8'
services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://caspian_user:${DB_PASSWORD:-password}@db:5433/caspian_db
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-mysecretkey}
    depends_on:
      - db
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: caspian_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: caspian_db
    ports:
      - "5433:5432"
    volumes:
      - caspian_db_data:/var/lib/postgresql/data
volumes:
  caspian_db_data: