name: Deploy to VM on Google Cloud Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
      
      - name: Deploy to VM instance
        run: |
          # Prepare deployment key
          echo "${{ secrets.VM_SSH_KEY }}" > ./deploy_key
          chmod 600 ./deploy_key
          
          # Get VM external IP
          VM_IP=$(gcloud compute instances describe caspian-server --zone=us-central1-a --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          
          # Copy project files to VM
          rsync -avz -e "ssh -i ./deploy_key -o StrictHostKeyChecking=no" \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            --exclude=".venv/" \
            . ${{ secrets.VM_USER }}@${VM_IP}:~/caspian/
          
          # Execute deployment script on VM
          ssh -i ./deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${VM_IP} << 'EOF'
            cd ~/caspian
            # Create/update .env file with secrets
            cat > .env << ENVEOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF
            
            # Deploy with Docker Compose
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Run database migrations if needed
            # docker-compose exec -T backend python -m app.scripts.setup_db
          EOF
          
          # Clean up
          rm ./deploy_key