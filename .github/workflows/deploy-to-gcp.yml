name: Deploy to VM

on:
  push:
    branches: [ main, gama ]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'remote'
        type: choice
        options:
        - remote
        - local

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Deploy to VM
        run: |
          # Prepare deployment key
          echo "${{ secrets.VM_SSH_KEY }}" > ./deploy_key
          chmod 600 ./deploy_key
          
          # Use the VM's IP address from secrets
          VM_IP="${{ secrets.VM_IP_ADDRESS }}"
          echo "Deploying to VM at IP: ${VM_IP}"
          
          # Copy project files to VM
          rsync -avz -e "ssh -i ./deploy_key -o StrictHostKeyChecking=no" \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            --exclude=".venv/" \
            . ${{ secrets.VM_USER }}@${VM_IP}:~/caspian/
          
          # Execute deployment script on VM
          ssh -i ./deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${VM_IP} << 'EOF'
            cd ~/caspian
            # Create/update .env file with secrets
            cat > .env << ENVEOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF
            
            # Deploy with Docker Compose
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            
            # Run database migrations if needed
            # docker-compose exec -T backend python -m app.scripts.setup_db
          EOF
          
          # Clean up
          rm ./deploy_key