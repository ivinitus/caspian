name: Deploy to VM

on:
  push:
    branches: [ main, gama ]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'remote'
        type: choice
        options:
        - remote
        - local

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Deploy to VM
        run: |
          # Prepare deployment key
          echo "${{ secrets.VM_SSH_KEY }}" > ./deploy_key
          chmod 600 ./deploy_key
          
          # Display key info for debugging
          echo "SSH key info:"
          file ./deploy_key
          cat -A ./deploy_key | head -1
          
          # Try to fix key format if needed
          echo "Checking and fixing key format if necessary..."
          if grep -q "OPENSSH PRIVATE KEY" ./deploy_key; then
            echo "Key appears to be in OpenSSH format"
          elif grep -q "BEGIN RSA PRIVATE KEY" ./deploy_key; then
            echo "Key appears to be in PEM RSA format"
          elif grep -q "BEGIN PRIVATE KEY" ./deploy_key; then
            echo "Key appears to be in PKCS8 format"
          else
            echo "Key format not recognized. Attempting to convert..."
            cp ./deploy_key ./deploy_key.bak
            
            # Remove any unexpected characters
            tr -cd '\11\12\15\40-\176' < ./deploy_key.bak > ./deploy_key
            chmod 600 ./deploy_key
            
            # If there's still an issue, try converting to PEM format
            if ! ssh-keygen -y -f ./deploy_key &>/dev/null; then
              echo "Attempting to convert key to PEM format..."
              ssh-keygen -p -N "" -m PEM -f ./deploy_key
            fi
          fi
          
          # Extract and display the public key for verification
          echo "Public key derived from the private key:"
          ssh-keygen -y -f ./deploy_key || echo "Failed to extract public key - the key might be in an unsupported format or passphrase protected"
          
          # Use the VM's IP address from secrets
          VM_IP="${{ secrets.VM_IP_ADDRESS }}"
          echo "Deploying to VM at IP: ${VM_IP}"
          echo "Using username: ${{ secrets.VM_USER }}"
          
          # Test SSH connection before rsync
          echo "Testing SSH connection..."
          if ssh -v -i ./deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o PubkeyAcceptedKeyTypes=+ssh-rsa ${{ secrets.VM_USER }}@${VM_IP} "echo SSH connection successful"; then
            echo "SSH connection established successfully. Proceeding with deployment."
            
            # Copy project files to VM
            echo "Copying project files to VM..."
            rsync -avz -e "ssh -i ./deploy_key -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa" \
              --exclude=".git/" \
              --exclude="node_modules/" \
              --exclude="__pycache__/" \
              --exclude="*.pyc" \
              --exclude=".venv/" \
              . ${{ secrets.VM_USER }}@${VM_IP}:~/caspian/
          
            
            # Execute deployment script on VM
            echo "Running deployment script on VM..."
            ssh -i ./deploy_key -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ${{ secrets.VM_USER }}@${VM_IP} "cd ~/caspian && \
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' > .env && \
            echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' >> .env && \
            echo 'DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}' >> .env && \
            echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env && \
            mkdir -p db-backups && \
            echo 'Cleaning up Docker system to free disk space...' && \
            docker system prune -af --volumes && \
            docker builder prune -af && \
            df -h && \
            docker-compose down && \
            docker-compose build --no-cache && \
            docker-compose up -d && \
            echo 'Waiting for database to be ready...' && \
            sleep 30 && \
            echo 'Creating database backup...' && \
            docker-compose exec -T postgres pg_dump -U caspian_user caspian_db > ./db-backups/backup_\$(date +%Y%m%d_%H%M%S).sql && \
            echo 'Running database migrations...' && \
            docker-compose exec -T backend bash -c 'cd /app && python -m scripts.setup_db'"
          else
            echo "Failed to establish SSH connection to ${VM_IP}"
            echo "Please ensure the following:"
            echo "1. The SSH key provided in VM_SSH_KEY secret is correct"
            echo "2. The public key derived from this private key is added to authorized_keys on the VM"
            echo "3. The VM_USER secret contains the correct username for the VM"
            echo "4. The VM_IP_ADDRESS secret contains the correct IP address"
            
            echo "Trying to get more information about the host..."
            ping -c 3 ${VM_IP} || true
            
            exit 1
          fi
          
          # Clean up
          rm ./deploy_key