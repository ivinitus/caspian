name: Deploy to VM

on:
  push:
    branches: [ main, gama ]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Type of deployment'
        required: true
        default: 'remote'
        type: choice
        options:
        - remote
        - local
      full_rebuild:
        description: 'Force full rebuild of all containers'
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Deploy to VM
        run: |
          echo "${{ secrets.VM_SSH_KEY }}" > ./deploy_key
          chmod 600 ./deploy_key
          VM_IP="${{ secrets.VM_IP_ADDRESS }}"
          echo "Deploying to VM at IP: ${VM_IP}"
          echo "Using username: ${{ secrets.VM_USER }}"
          if ssh -i ./deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o PubkeyAcceptedKeyTypes=+ssh-rsa ${{ secrets.VM_USER }}@${VM_IP} "echo SSH connection successful"; then
            rsync -avz -e "ssh -i ./deploy_key -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa" \
              --exclude=".git/" \
              --exclude="node_modules/" \
              --exclude="__pycache__/" \
              --exclude="*.pyc" \
              --exclude=".venv/" \
              . ${{ secrets.VM_USER }}@${VM_IP}:~/caspian/
            ssh -i ./deploy_key -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa ${{ secrets.VM_USER }}@${VM_IP} "cd ~/caspian && \
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' > .env && \
            echo 'SECRET_KEY=${{ secrets.SECRET_KEY }}' >> .env && \
            echo 'DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}' >> .env && \
            echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env && \
            mkdir -p db-backups && \
            DISK_USAGE=\$(df / | tail -1 | awk '{print \$5}' | sed 's/%//') && \
            if [ \"\$DISK_USAGE\" -gt 80 ]; then \
              docker system prune -af --volumes && \
              docker builder prune -af && \
              df -h; \
            fi && \
            docker-compose down && \
            FULL_REBUILD='${{ github.event.inputs.full_rebuild || 'false' }}' && \
            if [ \"\$FULL_REBUILD\" = \"true\" ]; then \
              docker-compose build --no-cache; \
            else \
              docker-compose pull || true && \
              CHANGED=false && \
              if [ -n \"\$(find ./caspian/backend -type f -newer .last_deploy 2>/dev/null)\" ]; then \
                docker-compose build backend && \
                CHANGED=true; \
              fi && \
              if [ -n \"\$(find ./caspian/frontend -type f -newer .last_deploy 2>/dev/null)\" ]; then \
                docker-compose build frontend && \
                CHANGED=true; \
              fi && \
              if [ \"\$CHANGED\" = \"false\" ]; then \
                docker-compose build; \
              fi; \
            fi && \
            touch .last_deploy && \
            docker-compose up -d && \
            sleep 30 && \
            docker-compose exec -T postgres pg_dump -U caspian_user caspian_db > ./db-backups/backup_\$(date +%Y%m%d_%H%M%S).sql && \
            docker-compose exec -T backend bash -c 'cd /app && python -m scripts.setup_db'"
          else
            echo "Failed to establish SSH connection to ${VM_IP}"
            exit 1
          fi
          rm ./deploy_key